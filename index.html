<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Digest Maker</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; color:#eee; font-family:-apple-system,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* ヘッダー */
#hd { background:#16213e; padding:6px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #0f3460; -webkit-app-region:drag; flex-shrink:0; }
#hd h1 { font-size:15px; color:#e94560; font-weight:700; }
.rt { font-size:22px; font-weight:700; font-family:monospace; color:#fff; }
.st { font-size:11px; color:#aaa; }
.hb { -webkit-app-region:no-drag; border:none; color:#fff; padding:6px 13px; border-radius:5px; cursor:pointer; font-size:12px; font-weight:600; }
#recBtn { background:#e94560; }
#recBtn.on { background:#555; }
#folderBtn { background:#0f3460; border:1px solid #1a6b9a; color:#5fa8d3; margin-left:auto; }
#fcpxmlBtn { background:#0f3460; border:1px solid #8e44ad; color:#b07cd6; }
#prxmlBtn { background:#0f3460; border:1px solid #9b59b6; color:#c89be0; }
#fcpxmlBtn:disabled, #prxmlBtn:disabled { opacity:0.5; cursor:wait; }
#exportBtn { background:#0f3460; border:1px solid #e94560; color:#e94560; }
#exportBtn:disabled { opacity:0.5; cursor:wait; }
#camSel { -webkit-app-region:no-drag; background:#0f3460; border:1px solid #333; color:#eee; padding:4px 7px; border-radius:5px; font-size:11px; max-width:155px; }
#audSel { -webkit-app-region:no-drag; background:#0f3460; border:1px solid #333; color:#eee; padding:4px 7px; border-radius:5px; font-size:11px; max-width:150px; }
#vu { display:flex; gap:2px; height:26px; align-items:flex-end; padding:2px 4px; background:#0a0a14; border:1px solid #333; border-radius:4px; }
#vu .vuch { width:5px; height:22px; background:#1c1c28; border-radius:2px; overflow:hidden; position:relative; display:flex; align-items:flex-end; }
#vu .vuch i { display:block; width:100%; height:0%; background:linear-gradient(to top,#27ae60 0%,#27ae60 60%,#f0a500 80%,#e94560 100%); transition:height .05s linear; }
#vu.rec { opacity:0.35; }
#reloadCamBtn { background:#0f3460; border:1px solid #333; color:#5fa8d3; padding:5px 8px; }
#reloadCamBtn:hover { background:#1a6b9a; color:#fff; }
.dd { font-size:12px; color:#f0a500; font-family:monospace; }
.sd { font-size:10px; color:#27ae60; font-family:monospace; }
#pxSt { font-size:10px; padding:2px 7px; border-radius:3px; background:#333; color:#777; }
#pxSt.ok { background:#0d2218; color:#27ae60; }

/* 3カラム */
#main { display:flex; flex:1; overflow:hidden; }

/* 左：ライブ */
#lp { width:37%; display:flex; flex-direction:column; border-right:1px solid #0f3460; flex-shrink:0; }
#lw { flex:1; background:#000; position:relative; }
#lv { width:100%; height:100%; object-fit:contain; }
#rb { position:absolute; top:6px; left:6px; background:rgba(233,69,96,0.9); color:#fff; padding:3px 8px; border-radius:3px; font-size:11px; font-weight:700; display:none; }
#rb.on { display:block; }
#cs { position:absolute; bottom:5px; left:6px; font-size:10px; color:#aaa; background:rgba(0,0,0,0.6); padding:2px 6px; border-radius:3px; }
#iob { background:#16213e; padding:8px 10px; display:flex; gap:6px; align-items:center; border-top:1px solid #0f3460; flex-shrink:0; }
.ib { border:none; color:#cfd6e6; padding:8px 14px; border-radius:5px; cursor:pointer; font-size:13px; font-weight:700; background:#243046; transition:background .12s, color .12s; }
#inB.act  { background:#27ae60; color:#fff; }
#outB.act { background:#e67e22; color:#fff; }
#inD  { font-family:monospace; font-size:12px; color:#27ae60; min-width:80px; }

/* 中：クリップリスト */
#cp { width:33%; display:flex; flex-direction:column; border-right:1px solid #0f3460; }
#cph { padding:6px 10px; background:#16213e; border-bottom:1px solid #0f3460; display:flex; align-items:center; gap:6px; flex-shrink:0; }
#cph h2 { font-size:12px; color:#aaa; flex:1; }
#paB { background:#27ae60; border:none; color:#fff; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:11px; font-weight:700; }
#spB { background:#e94560; border:none; color:#fff; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:11px; display:none; }
#cl { flex:1; overflow-y:auto; padding:4px; }
.ci { background:#16213e; border:1px solid #0f3460; border-radius:5px; padding:6px 8px; margin-bottom:4px; display:flex; align-items:center; gap:5px; cursor:pointer; transition:border-color 0.1s; }
.ci.sel { border-color:#e94560; box-shadow:0 0 0 1px #e94560 inset; }
.ci:hover { border-color:#555; }
.ci.playing { border-color:#27ae60; background:#0d2218; }
.cn { color:#e94560; font-weight:700; font-size:12px; min-width:16px; }
.cthumb { width:60px; height:34px; border-radius:3px; background:#000 center/cover no-repeat; flex-shrink:0; border:1px solid #0f3460; position:relative; }
.cthumb:not(.has)::after { content:'…'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#445; font-size:14px; }
.cif { flex:1; min-width:0; }
.cd { font-size:12px; color:#fff; font-weight:600; }
.ct { font-family:monospace; font-size:10px; color:#aaa; }
.cs2 { font-size:9px; color:#444; }
.cready { font-size:9px; color:#27ae60; }
.cready.wait { color:#555; }
.cb { border:none; color:#fff; border-radius:3px; cursor:pointer; font-size:10px; padding:3px 6px; flex-shrink:0; }
.slb { background:#333; }
.slb.on { background:#f0a500; color:#000; }
.plb { background:#27ae60; }
.dup { background:#0f3460; color:#5fa8d3; }
.dup:hover { background:#1a6b9a; color:#fff; }
.mvb { background:#222; color:#888; padding:3px 4px; }
.mvb:hover { background:#0f3460; color:#fff; }
.dlb { background:none; color:#555; font-size:13px; }
.dlb:hover { color:#e94560; }

/* 右：プレビュー */
#pp { flex:1; display:flex; flex-direction:column; }
#pvh { padding:6px 10px; background:#16213e; border-bottom:1px solid #0f3460; display:flex; align-items:center; gap:6px; flex-shrink:0; }
#pvh h2 { font-size:12px; color:#aaa; }
#pvlb { font-size:11px; color:#27ae60; flex:1; }
#pvix { font-size:10px; color:#555; }
#pvw { flex:1; background:#000; position:relative; overflow:hidden; }
#pv { width:100%; height:100%; object-fit:contain; }
#pvpb { position:absolute; top:6px; left:6px; background:rgba(39,174,96,0.9); color:#fff; padding:3px 8px; border-radius:3px; font-size:11px; font-weight:700; display:none; }
#pvpb.on { display:block; }
#pvslb { position:absolute; top:6px; right:6px; background:rgba(240,165,0,0.9); color:#000; padding:3px 8px; border-radius:3px; font-size:11px; font-weight:700; display:none; }
#pvslb.on { display:block; }
#pvld { position:absolute; inset:0; background:rgba(0,0,0,0.82); display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; font-size:13px; }
#pvld.on { display:flex; }
#pvld p { font-size:11px; color:#777; }
#pvc { padding:7px 10px; background:#16213e; border-top:1px solid #0f3460; display:flex; gap:5px; align-items:center; flex-shrink:0; }
.pb { border:none; color:#fff; border-radius:4px; cursor:pointer; font-size:12px; padding:6px 12px; }
#pvprev { background:#0f3460; }
#pvpaus { background:#27ae60; font-weight:700; }
#pvnext { background:#0f3460; }
#pvslw  { background:#333; }
#pvslw.on { background:#f0a500; color:#000; }
#pvstop { background:#e94560; }
.pvsp { flex:1; }

/* タイムライン */
#tlp { height:86px; background:#0d0d1a; border-top:1px solid #0f3460; position:relative; flex-shrink:0; }
#tlp h3 { position:absolute; top:4px; left:8px; font-size:10px; color:#555; }
#tlt { position:absolute; top:18px; left:0; right:0; bottom:4px; display:flex; align-items:center; padding:0 8px; gap:2px; overflow-x:auto; }
.tlc { height:46px; min-width:36px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#fff; flex-shrink:0; cursor:pointer; }
.tlc:hover { opacity:0.8; }
.tlc.playing { outline:2px solid #fff; }
.tlc span { padding:0 3px; text-align:center; line-height:1.3; }
.tltot { position:absolute; bottom:3px; right:8px; font-size:10px; font-family:monospace; color:#f0a500; }

/* トリミングモーダル */
#trm { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:999; align-items:center; justify-content:center; }
#trm.on { display:flex; }
#trbox { background:#16213e; border:1px solid #0f3460; border-radius:10px; width:680px; max-width:92vw; padding:16px; display:flex; flex-direction:column; gap:10px; }
#trbox h2 { font-size:13px; color:#e94560; }
#trvw { background:#000; border-radius:5px; position:relative; overflow:hidden; }
#trv { width:100%; max-height:270px; object-fit:contain; display:block; }
#trvt { position:absolute; bottom:4px; right:6px; font-family:monospace; font-size:11px; color:#fff; background:rgba(0,0,0,0.7); padding:2px 5px; border-radius:3px; }
/* トリムバー */
#trbarwrap { overflow-x:auto; overflow-y:hidden; border-radius:4px; background:#0d0d1a; }
#trbarwrap::-webkit-scrollbar { height:8px; }
#trbarwrap::-webkit-scrollbar-thumb { background:#0f3460; border-radius:4px; }
#trbar { position:relative; height:50px; background:#0d0d1a; border-radius:4px; cursor:default; width:100%; }
.tcjump { background:#0f3460; }
.tcnudge { background:#2c3e6b; padding:6px 8px; }
.tczoom { background:#8e44ad; }
.tcsep { color:#444; }
.tlzbtn { background:#8e44ad; color:#fff; border:none; border-radius:3px; width:20px; height:18px; font-size:12px; cursor:pointer; margin-left:4px; vertical-align:middle; }
.tlzbtn:hover { background:#a55cc8; }
#trtrack { position:absolute; top:13px; left:0; right:0; height:22px; background:#333; border-radius:3px; }
#trclip { position:absolute; top:13px; height:22px; background:#1a6b9a; opacity:0.35; pointer-events:none; border-radius:2px; }
#trrange { position:absolute; top:13px; height:22px; background:#e94560; opacity:0.5; pointer-events:none; }
#trslowlayer { position:absolute; top:13px; height:22px; left:0; right:0; pointer-events:none; }
.slowseg { position:absolute; top:0; height:22px; background:#f0a500; opacity:0.75; border-radius:2px; }
.slowseg::after { content:'🐢'; position:absolute; top:2px; left:50%; transform:translateX(-50%); font-size:11px; }
#trhIn  { position:absolute; top:5px; width:12px; height:38px; background:#27ae60; border-radius:3px; cursor:ew-resize; transform:translateX(-50%); z-index:10; display:flex; align-items:center; justify-content:center; }
#trhOut { position:absolute; top:5px; width:12px; height:38px; background:#e67e22; border-radius:3px; cursor:ew-resize; transform:translateX(-50%); z-index:10; display:flex; align-items:center; justify-content:center; }
#trhIn::after,#trhOut::after { content:''; width:2px; height:16px; background:rgba(255,255,255,0.5); border-radius:1px; }
#trph { position:absolute; top:5px; width:2px; height:38px; background:#fff; pointer-events:none; z-index:8; }
.trlb { position:absolute; bottom:-15px; font-size:9px; font-family:monospace; white-space:nowrap; transform:translateX(-50%); color:#aaa; }
#trctr { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
#trslowctr { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding-top:4px; border-top:1px solid #0f3460; }
#trbtns { display:flex; gap:6px; align-items:center; justify-content:flex-end; }
.slowlbl { font-size:11px; color:#f0a500; font-weight:700; }
.tcslow { background:#f0a500; color:#000; }
.slowsel { background:#0f3460; color:#eee; border:1px solid #333; border-radius:4px; padding:5px; font-size:11px; }
#slowInfo { font-family:monospace; font-size:11px; color:#f0a500; flex:1; }
#tcslclr { background:#444; }
.tc { border:none; color:#fff; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:11px; font-weight:600; }
#tcpl { background:#27ae60; }
#tcin { background:#27ae60; }
#tcot { background:#e67e22; }
#tcap { background:#e94560; }
#tccn { background:#444; }
#tcif { font-family:monospace; font-size:11px; color:#aaa; flex:1; text-align:center; }
</style>
</head>
<body>

<div id="hd">
  <h1>🎬 Digest Maker</h1>
  <div>
    <div class="rt" id="recTime">00:00:00</div>
    <div class="st">目標 05:00 | 残 <span id="remDisp" style="color:#f0a500">05:00</span></div>
  </div>
  <button class="hb" id="recBtn" onclick="toggleRec()" title="録画スタート/ストップ（Rキー）">● REC</button>
  <select id="camSel" onchange="startCam()"><option>選択中...</option></select>
  <select id="audSel" title="録音する音声デバイス" onchange="startVU()"><option value="">🔇 音声なし</option></select>
  <div id="vu" title="音声入力レベル"><div class="vuch"><i id="vuL"></i></div><div class="vuch"><i id="vuR"></i></div></div>
  <button class="hb" id="reloadCamBtn" onclick="reloadCams()" title="デバイス再読み込み（OBS/キャプチャ起動後に押す）">🔄</button>
  <span class="dd">合計:<span id="totDur">0:00</span></span>
  <span class="sd" id="segD">SEG:-</span>
  <span id="pxSt">PROXY:-</span>
  <button class="hb" id="folderBtn" onclick="chooseFolder()" title="録画の保存先を選択">📁 保存先</button>
  <button class="hb" id="fcpxmlBtn" onclick="doExportFcpxml()" title="DaVinci Resolve用（FCPXML）">🎬 FCPXML</button>
  <button class="hb" id="prxmlBtn" onclick="doExportPremiereXml()" title="Premiere Pro用（FCP7 XML）">🟣 Pr XML</button>
  <button class="hb" id="exportBtn" onclick="doExport()">📤 MP4書き出し</button>
</div>

<div id="main">
  <!-- 左：ライブ -->
  <div id="lp">
    <div id="lw">
      <video id="lv" autoplay muted playsinline></video>
      <div id="rb">● REC</div>
      <div id="cs">初期化中...</div>
    </div>
    <div id="iob">
      <button class="ib" id="inB"  onclick="setIn()" title="IN点をセット（Iキー）">[ IN <small>(I)</small></button>
      <span id="inD">IN: --:--</span>
      <button class="ib" id="outB" onclick="setOut()" title="OUT点をセットして登録（Oキー）">OUT ] <small>(O)</small></button>
    </div>
  </div>

  <!-- 中：クリップ -->
  <div id="cp">
    <div id="cph">
      <h2>クリップ (<span id="ccnt">0</span>)</h2>
      <button id="paB" onclick="playAll()">▶ 全再生</button>
      <button id="spB" onclick="stopPlay()">■ 停止</button>
    </div>
    <div id="cl"></div>
  </div>

  <!-- 右：プレビュー -->
  <div id="pp">
    <div id="pvh">
      <h2>📺 Preview&nbsp;</h2>
      <span id="pvlb">-</span>
      <span id="pvix"></span>
    </div>
    <div id="pvw">
      <video id="pv"></video>
      <div id="pvpb">▶ PLAY</div>
      <div id="pvslb">🐢 SLOW 50%</div>
      <div id="pvld"><span>⏳ クリップ準備中...</span><p id="pvldmsg"></p></div>
    </div>
    <div id="pvc">
      <button class="pb" id="pvprev" onclick="prevClip()">⏮</button>
      <button class="pb" id="pvpaus" onclick="pvPause()">⏸</button>
      <button class="pb" id="pvnext" onclick="nextClip()">⏭</button>
      <button class="pb" id="pvslw"  onclick="pvToggleSlow()">🐢 スロー</button>
      <span class="pvsp"></span>
      <button class="pb" id="pvstop" onclick="stopPlay()">■ 停止</button>
    </div>
  </div>
</div>

<div id="tlp">
  <h3>TIMELINE <button class="tlzbtn" onclick="tlZoom(1)" title="拡大（X）">＋</button><button class="tlzbtn" onclick="tlZoom(-1)" title="縮小（Z）">－</button></h3>
  <div id="tlt"></div>
  <div class="tltot" id="tlTot">合計: 0:00 / 目標: 5:00</div>
</div>

<!-- トリミング -->
<div id="trm">
  <div id="trbox">
    <h2>✂ トリミング ＆ 可変スロー</h2>
    <div id="trvw">
      <video id="trv"></video>
      <div id="trvt">0:00</div>
    </div>
    <div id="trbarwrap">
      <div id="trbar">
        <div id="trtrack"></div>
        <div id="trclip"></div>
        <div id="trrange"></div>
        <div id="trslowlayer"></div>
        <div id="trhIn"><span class="trlb" id="lbIn">IN</span></div>
        <div id="trhOut"><span class="trlb" id="lbOut">OUT</span></div>
        <div id="trph"></div>
      </div>
    </div>
    <div id="trctr">
      <button class="tc" id="tcpl" onclick="trimPlay()">▶ 再生</button>
      <button class="tc tcjump" onclick="trimJumpIn()" title="IN点へ移動">⏮ IN</button>
      <button class="tc tcjump" onclick="trimJumpOut()" title="OUT点へ移動">OUT ⏭</button>
      <span class="tcsep">|</span>
      <button class="tc" id="tcin" onclick="trimSetIn()" title="現在位置をINに（I）">[ IN</button>
      <button class="tc tcnudge" onclick="trimNudge('in',-1)" title="INを1コマ戻す">IN−</button>
      <button class="tc tcnudge" onclick="trimNudge('in',1)" title="INを1コマ送る">IN+</button>
      <button class="tc" id="tcot" onclick="trimSetOut()" title="現在位置をOUTに（O）">OUT ]</button>
      <button class="tc tcnudge" onclick="trimNudge('out',-1)" title="OUTを1コマ戻す">OUT−</button>
      <button class="tc tcnudge" onclick="trimNudge('out',1)" title="OUTを1コマ送る">OUT+</button>
      <span class="tcsep">|</span>
      <button class="tc tczoom" onclick="trimZoom(1)" title="拡大（X）">🔍＋</button>
      <button class="tc tczoom" onclick="trimZoom(-1)" title="縮小（Z）">🔍－</button>
      <span id="tcif">--</span>
    </div>
    <div id="trslowctr">
      <span class="slowlbl">🐢 可変スロー:</span>
      <button class="tc tcslow" id="tcslin" onclick="slowSetStart()">スロー開始点</button>
      <button class="tc tcslow" id="tcslout" onclick="slowSetEnd()">スロー終了点</button>
      <select id="slowRate" class="slowsel">
        <option value="2">0.5倍速</option>
        <option value="3">0.33倍速</option>
        <option value="4">0.25倍速</option>
      </select>
      <span id="slowInfo">区間:なし</span>
      <button class="tc" id="tcslclr" onclick="slowClear()">区間クリア</button>
    </div>
    <div id="trbtns">
      <button class="tc" id="tccn" onclick="closeTrim()">キャンセル</button>
      <button class="tc" id="tcap" onclick="applyTrim()">✓ 適用</button>
    </div>
  </div>
</div>

<script>
const { ipcRenderer } = require('electron');

const TARGET = 300;
const COLORS = ['#e94560','#1a6b9a','#27ae60','#e67e22','#8e44ad','#2980b9','#c0392b','#16a085','#d35400','#7f8c8d'];

let isRec=false, recMs=null, recTmr=null;
let clips=[], inT=null, segLog=[], proxyLog=[];
let clipCounter=0;  // 連番（並べ替えても変わらない固定番号）
let playing=false, pQueue=[], pIdx=0, pvSlow=false, pTimer=null;
let selIdx=-1;  // 選択中クリップ（全再生の開始位置）

const pv = document.getElementById('pv');

// ── カメラ ──
let avDevices = [];        // avfoundation の実デバイス [{index,name}]
let avAudio = [];          // 音声デバイス [{index,name}]
let selectedAvIndex = -1;  // 録画に使う avfoundation インデックス（-1=未選択）

// 見えない制御文字（LTRマーク等）を除去して比較・表示用に整える
function cleanName(s){ return String(s||'').replace(/[\u200E\u200F\u202A-\u202E]/g,'').trim(); }

async function loadAvDevices(){
  try {
    const r = await ipcRenderer.invoke('list-av-devices');
    avDevices = (r && r.devices) ? r.devices : [];
    avAudio = (r && r.audio) ? r.audio : [];
  } catch(e){ avDevices = []; avAudio = []; }
  console.log('[AV] video:', avDevices, 'audio:', avAudio);
  // 音声デバイスのドロップダウンを更新
  const aud=document.getElementById('audSel');
  if(aud){
    const prev=aud.value;
    aud.innerHTML='<option value="">🔇 音声なし</option>';
    avAudio.forEach(d=>{
      const o=document.createElement('option');
      o.value=String(d.index);
      o.textContent=`🎙 ${d.index}: ${cleanName(d.name)}`;
      aud.appendChild(o);
    });
    // 以前の選択を維持
    if(prev!=='' && avAudio.some(d=>String(d.index)===prev)) aud.value=prev;
  }
  startVU();  // 音声レベル監視を開始/更新
}

// ── 音声入力モニター（VUメーター） ──
let vuStream=null, vuCtx=null, vuRAF=null;
function stopVU(){
  if(vuRAF){ cancelAnimationFrame(vuRAF); vuRAF=null; }
  if(vuStream){ try{vuStream.getTracks().forEach(t=>t.stop());}catch(e){} vuStream=null; }
  if(vuCtx){ try{vuCtx.close();}catch(e){} vuCtx=null; }
  const l=document.getElementById('vuL'), r=document.getElementById('vuR');
  if(l) l.style.height='0%'; if(r) r.style.height='0%';
}
async function matchBrowserAudioId(avName){
  const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
  const an=cleanName(avName).toLowerCase();
  let hit=devs.find(d=>cleanName(d.label).toLowerCase()===an)
        || devs.find(d=>{const bl=cleanName(d.label).toLowerCase(); return bl&&(bl.includes(an)||an.includes(bl));});
  return hit?hit.deviceId:'';
}
async function startVU(){
  stopVU();
  if(isRec){ console.log('[VU] skip (recording)'); return; }
  const aIdx=document.getElementById('audSel').value;
  if(aIdx===''){ console.log('[VU] no audio device selected'); return; }
  const dev=avAudio.find(d=>String(d.index)===aIdx);
  const bid=dev ? await matchBrowserAudioId(dev.name) : '';
  console.log('[VU] start: avIdx=',aIdx,'name=',dev&&dev.name,'browserId=',bid||'(default)');
  // まず厳密指定→ダメなら緩い指定→最後にデフォルトで順にトライ
  const tries = [];
  if(bid) tries.push({audio:{deviceId:{exact:bid}}, video:false});
  if(bid) tries.push({audio:{deviceId:bid}, video:false});
  tries.push({audio:true, video:false});
  for(const constraints of tries){
    try{
      vuStream=await navigator.mediaDevices.getUserMedia(constraints);
      const tr=vuStream.getAudioTracks()[0];
      console.log('[VU] got stream:', tr&&tr.label);
      break;
    }catch(e){ console.warn('[VU] getUserMedia try failed:', e.name, e.message); vuStream=null; }
  }
  if(!vuStream){ console.error('[VU] could not open any audio input'); return; }
  try{
    vuCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(vuCtx.state==='suspended'){ try{ await vuCtx.resume(); }catch(e){} }
    const src=vuCtx.createMediaStreamSource(vuStream);
    const splitter=vuCtx.createChannelSplitter(2);
    src.connect(splitter);
    const anL=vuCtx.createAnalyser(), anR=vuCtx.createAnalyser();
    anL.fftSize=256; anR.fftSize=256;
    splitter.connect(anL,0); splitter.connect(anR,1);
    const bufL=new Uint8Array(anL.fftSize), bufR=new Uint8Array(anR.fftSize);
    const elL=document.getElementById('vuL'), elR=document.getElementById('vuR');
    const rms=(an,buf)=>{ an.getByteTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128; s+=v*v;} return Math.sqrt(s/buf.length); };
    let pL=0,pR=0;
    const loop=()=>{
      const l=Math.min(1,rms(anL,bufL)*3.5), r=Math.min(1,rms(anR,bufR)*3.5);
      pL=Math.max(l, pL*0.85); pR=Math.max(r, pR*0.85);
      elL.style.height=(pL*100).toFixed(0)+'%';
      elR.style.height=(pR*100).toFixed(0)+'%';
      vuRAF=requestAnimationFrame(loop);
    };
    loop();
    console.log('[VU] meter running');
  }catch(e){ console.error('[VU] audio context error:', e); }
}

// avfoundationデバイス名に対応するブラウザの deviceId を探す（プレビュー用・best-effort）
function matchBrowserId(avName, browserDevs){
  const an = cleanName(avName).toLowerCase();
  if(!an) return '';
  let hit = browserDevs.find(d => cleanName(d.label).toLowerCase() === an);
  if(!hit) hit = browserDevs.find(d => {
    const bl = cleanName(d.label).toLowerCase();
    return bl && (bl.includes(an) || an.includes(bl));
  });
  return hit ? hit.deviceId : '';
}

async function markClip(){
  if(inT===null) return alert('先にIN');
  const ot=Math.floor((Date.now()-recMs)/1000);
  if(ot<=inT) return alert('OUTはINより後に');
  const log=await ipcRenderer.invoke('get-segment-log');
  // INが属するセグメントを特定（次回トリムの中心用。範囲はまたいでOK）
  let s=null;
  for(let i=log.length-1;i>=0;i--){
    if(log[i].startSec<=inT){s=log[i];break;}
  }
  if(!s&&log.length>0) s=log[0];
  if(!s) s={index:0,startSec:0,path:''};

  // セグメント境界はまたいで構わない（書き出し時に複数セグメントを自動連結）
  const finalOut = ot;

  // OUTボタンを一瞬点灯（オレンジ）
  const outB=document.getElementById('outB');
  outB.classList.add('act');
  setTimeout(()=>{ outB.classList.remove('act'); document.getElementById('inB').classList.remove('act'); }, 450);

  const newClip = {
    id:Date.now(), num:++clipCounter, inSec:inT, outSec:finalOut, duration:finalOut-inT,
    segIndex:s.index, segPath:s.path, segStartSec:s.startSec,
    slow:false, label:`クリップ ${clipCounter}`
  };
  clips.push(newClip);
  inT=null;
  document.getElementById('inD').textContent='IN: --:--';
  renderClips();

  // 登録直後にバックグラウンドでプレビュー切り出しを開始

}

// クリップの切り出し結果をキャッシュ（id -> filepath）
let extractCache = {};
let extractInflight = {};  // 進行中の切り出し（二重起動防止）
let thumbCache = {};       // クリップサムネ（id -> file path）
let thumbInflight = {};

// サムネをバックグラウンド生成
async function ensureThumb(clip){
  if(thumbCache[clip.id]) return thumbCache[clip.id];
  if(thumbInflight[clip.id]) return await thumbInflight[clip.id];
  const p=(async()=>{
    const r=await ipcRenderer.invoke('make-thumb',clip);
    delete thumbInflight[clip.id];
    if(r&&r.success){
      thumbCache[clip.id]=r.path;
      const el=document.getElementById(`thumb-${clip.id}`);
      if(el){ el.style.backgroundImage=`url('file://${r.path}?t=${Date.now()}')`; el.classList.add('has'); }
      return r.path;
    }
    return null;
  })();
  thumbInflight[clip.id]=p;
  return await p;
}

async function ensureExtracted(clip, _attempt){
  if(extractCache[clip.id]) return extractCache[clip.id];
  // すでに切り出し中なら、その完了を待つ
  if(extractInflight[clip.id]) return await extractInflight[clip.id];

  const attempt = _attempt || 1;
  const p = (async()=>{
    const r=await ipcRenderer.invoke('extract-clip',clip);
    delete extractInflight[clip.id];
    if(r.success){
      extractCache[clip.id]=r.path;
      const el=document.getElementById(`ready-${clip.id}`);
      if(el){ el.textContent='●'; el.classList.remove('wait'); }
      return r.path;
    }
    // 失敗：録画中は切り出し元（セグメント）がまだ不安定なことがあるので自動リトライ
    if(attempt < 5){
      console.log(`[EXTRACT] retry clip ${clip.id} (attempt ${attempt+1})`);
      const el=document.getElementById(`ready-${clip.id}`);
      if(el){ el.textContent='⏳'; el.classList.add('wait'); }
      setTimeout(()=>{ if(!extractCache[clip.id] && !extractInflight[clip.id]) ensureExtracted(clip, attempt+1); }, 3000);
    } else {
      console.log(`[EXTRACT] give up clip ${clip.id} after ${attempt} attempts`);
    }
    return null;
  })();
  extractInflight[clip.id] = p;
  return await p;
}

// 次のクリップを裏で先読み（進行中なら何もしない）
function prefetchNext(){
  const nextIdx = pQueue[pIdx+1];
  if(nextIdx===undefined) return;
  const nextClip = clips[nextIdx];
  if(nextClip && !extractCache[nextClip.id] && !extractInflight[nextClip.id]){
    ensureExtracted(nextClip);
  }
}

async function playSingle(idx){
  const clip=clips[idx]; if(!clip) return;
  document.getElementById('pvlb').textContent=clip.label;
  document.getElementById('pvix').textContent=`(${idx+1}/${clips.length})`;
  document.getElementById('pvslb').classList.toggle('on',clip.slow||pvSlow);
  hlPlay(idx,true);

  // 既に切り出し済みか確認
  let filePath = extractCache[clip.id];
  if(!filePath){
    const ld=document.getElementById('pvld');
    ld.classList.add('on');
    document.getElementById('pvldmsg').textContent='切り出し中...';
    filePath = await ensureExtracted(clip);
    ld.classList.remove('on');
  }

  if(!filePath){
    // 1回だけリトライ（キャッシュ削除して再切り出し）
    console.log('[PLAY] extract failed, retry once');
    delete extractCache[clip.id];
    delete extractInflight[clip.id];
    await ipcRenderer.invoke('delete-preview', clip.id);
    filePath = await ensureExtracted(clip);
  }
  if(!filePath){
    console.log('[PLAY] extract failed after retry, skip');
    if(playing){pIdx++; if(pIdx<pQueue.length) playSingle(pQueue[pIdx]); else stopPlay();}
    return;
  }

  // クリーンアップ
  if(pTimer){clearTimeout(pTimer);pTimer=null;}
  pv.onended=null;
  pv.pause();

  pv.src=`file://${filePath}`;
  pv.load();
  pv.playbackRate=(clip.slow||pvSlow)?0.5:1.0;

  // canplay待ち（max6秒）。errorが出たら失敗扱い
  const loadOk = await new Promise(res=>{
    let done=false;
    const ok=(v)=>{if(!done){done=true;res(v);}};
    pv.addEventListener('canplay',()=>ok(true),{once:true});
    pv.addEventListener('error',()=>ok(false),{once:true});
    setTimeout(()=>ok(true),6000);
  });
  if(!playing) return;

  if(loadOk===false){
    // 読み込み失敗→キャッシュ削除して次へ
    console.log('[PLAY] load error, skip');
    delete extractCache[clip.id];
    if(playing){pIdx++; if(pIdx<pQueue.length) playSingle(pQueue[pIdx]); else stopPlay();}
    return;
  }

  // 再生開始 & 次を先読み
  try{ await pv.play(); }catch(e){ console.error('pvPlay:',e); }
  prefetchNext();

  // onended主体で次へ（タイマーは保険）
  pv.onended=()=>{
    pv.onended=null;
    if(pTimer){clearTimeout(pTimer);pTimer=null;}
    if(!playing) return;
    pIdx++; if(pIdx<pQueue.length) playSingle(pQueue[pIdx]); else stopPlay();
  };

  // 保険タイマー（onendedが来ない場合のみ発火、duration+2秒）
  const rate=(clip.slow||pvSlow)?0.5:1.0;
  const ms=(clip.duration/rate)*1000 + 2000;
  pTimer=setTimeout(()=>{
    pTimer=null;
    if(!playing) return;
    if(pv.onended){ pv.onended=null; }
    pIdx++; if(pIdx<pQueue.length) playSingle(pQueue[pIdx]); else stopPlay();
  },ms);
}

async function playClip(idx){ selectClip(idx); stopPlay();playing=true;pQueue=[idx];pIdx=0;await playSingle(idx);}
async function playAll(){
  stopPlay();playing=true;
  // 選択クリップがあればそこから、なければ先頭から、最後まで連続再生
  const start=(selIdx>=0 && selIdx<clips.length)?selIdx:0;
  pQueue=clips.map((_,i)=>i).filter(i=>i>=start);
  pIdx=0;
  if(pQueue.length) await playSingle(pQueue[0]);
}
// クリップ選択（全再生の開始位置をハイライト）
function selectClip(idx){
  selIdx=idx;
  document.querySelectorAll('.ci').forEach(el=>el.classList.remove('sel'));
  const c=clips[idx]; if(c){ const el=document.getElementById('ci-'+c.id); if(el) el.classList.add('sel'); }
}
function stopPlay(){
  playing=false;
  if(pTimer){clearTimeout(pTimer);pTimer=null;}
  pv.onended=null; pv.pause(); pv.src='';
  // extractCacheは保持（再生のたびに切り出さないため）
  hlPlay(undefined,false);
  document.getElementById('pvlb').textContent='-';
  document.getElementById('pvix').textContent='';
  document.getElementById('pvslb').classList.remove('on');
  document.getElementById('spB').style.display='none';
  document.getElementById('paB').style.display='';
}
function prevClip(){if(!playing||pIdx<=0) return; if(pTimer){clearTimeout(pTimer);pTimer=null;} pIdx--; playSingle(pQueue[pIdx]);}
function nextClip(){if(!playing) return; if(pTimer){clearTimeout(pTimer);pTimer=null;} pIdx++; if(pIdx<pQueue.length) playSingle(pQueue[pIdx]); else stopPlay();}
function pvPause(){
  if(pv.paused){pv.play();document.getElementById('pvpaus').textContent='⏸';}
  else{pv.pause();document.getElementById('pvpaus').textContent='▶';}
}
pv.addEventListener('pause',()=>document.getElementById('pvpaus').textContent='▶');
pv.addEventListener('play', ()=>document.getElementById('pvpaus').textContent='⏸');

function pvToggleSlow(){
  pvSlow=!pvSlow;
  pv.playbackRate=pvSlow?0.5:1.0;
  document.getElementById('pvslw').classList.toggle('on',pvSlow);
  document.getElementById('pvslb').classList.toggle('on',pvSlow);
}

// ── タイムライン ──
let tlZoomFactor=1;  // タイムラインの拡大倍率
function tlZoom(dir){
  if(dir>0) tlZoomFactor=Math.min(6, tlZoomFactor*1.5);
  else tlZoomFactor=Math.max(1, tlZoomFactor/1.5);
  renderTL();
}
function renderTL(){
  const tl=document.getElementById('tlt'); tl.innerHTML='';
  const tot=clips.reduce((s,c)=>s+c.duration,0);
  const baseW=700*tlZoomFactor;
  clips.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='tlc'; d.id=`tl-${c.id}`;
    const ratio=tot>0?c.duration/tot:1/clips.length;
    d.style.width=Math.max(36,ratio*baseW)+'px';
    d.style.background=COLORS[i%COLORS.length];
    d.innerHTML=`<span>${c.num!==undefined?c.num:(i+1)}<br>${ft(c.duration)}${(c.slow||(c.slowRegions&&c.slowRegions.length))?'🐢':''}</span>`;
    d.onclick=()=>playClip(i);
    tl.appendChild(d);
  });
}
function updDur(){
  const tot=clips.reduce((s,c)=>s+c.duration,0);
  const rem=TARGET-tot;
  document.getElementById('totDur').textContent=ft(tot);
  document.getElementById('remDisp').textContent=rem>=0?ft(rem):'-'+ft(-rem);
  document.getElementById('remDisp').style.color=rem<0?'#e94560':'#f0a500';
  document.getElementById('tlTot').textContent=`合計: ${ft(tot)} / 目標: ${ft(TARGET)}`;
}

// ── トリミング ＆ 可変スロー ──
// trIn/trOut/スロー区間はすべて「セグメント先頭=0」基準の秒で扱う
let trId=null, trIn=0, trOut=0, trDur=0, trDrag=null;
let trSegStart=0;                // このセグメントの録画開始からの絶対秒
let trSlow=[];                   // [{start,end}] セグメント相対秒
let slowPendingStart=null;       // スロー開始点の一時保持
let trZoom=1;                    // トリムバーの時間軸ズーム倍率
const TRIM_FRAME=1/30;           // 1コマ＝1/30秒（微調整用）
const trv=document.getElementById('trv');
const trbar=document.getElementById('trbar');

async function openTrim(clipId){
  const clip=clips.find(c=>c.id===clipId); if(!clip) return;
  trId=clipId;
  document.getElementById('pvld').classList.add('on');
  document.getElementById('pvldmsg').textContent='セグメント映像を準備中...';
  // 所属セグメント＋前後を連結した広域プレビューを読み込む → IN/OUTを境界の外まで広げられる
  const r=await ipcRenderer.invoke('extract-range', { segIndex: clip.segIndex, before:1, after:2 });
  document.getElementById('pvld').classList.remove('on');
  if(!r.success) return alert('映像を読み込めませんでした');

  trSegStart = (r.segStartSec!==undefined) ? r.segStartSec : clip.segStartSec;
  trv.src=`file://${r.path}?t=${Date.now()}`;
  trv.load();
  await new Promise(res=>{let d=false;const f=()=>{if(!d){d=true;res();}};trv.addEventListener('loadedmetadata',f,{once:true});setTimeout(f,4000);});
  trDur = trv.duration || 20;

  // クリップの現在のIN/OUTをセグメント相対に変換
  trIn  = Math.max(0, clip.inSec  - trSegStart);
  trOut = Math.min(trDur, clip.outSec - trSegStart);
  if(trOut<=trIn) trOut=Math.min(trDur, trIn+1);

  // 既存スロー区間（クリップ相対）をセグメント相対に変換して復元
  trSlow = Array.isArray(clip.slowRegions)
    ? clip.slowRegions.map(rg=>({start:rg.start+trIn, end:rg.end+trIn}))
    : [];
  slowPendingStart=null;
  // スロー倍率の復元
  if(clip.slowRate) document.getElementById('slowRate').value=String(clip.slowRate);

  trv.currentTime=trIn;
  trZoom=1;  // ズームをリセット
  // 先にモーダルを表示してから位置計算（非表示=幅0だとハンドル位置が0になるため）
  document.getElementById('trm').classList.add('on');
  // レイアウト確定後に描画（2フレーム待ってから）
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    updTrimBar(); updTrimInfo(); renderSlow();
  }));
  // 念のため少し遅れても再計算
  setTimeout(()=>{ updTrimBar(); renderSlow(); }, 120);
}
function closeTrim(){document.getElementById('trm').classList.remove('on');trv.pause();trv.src='';trId=null;}

function updTrimBar(){
  // ズーム適用：バー幅 = 表示領域幅 × ズーム倍率（横スクロールで細かく選択）
  const wrap=document.getElementById('trbarwrap');
  const baseW=(wrap && wrap.clientWidth) ? wrap.clientWidth : 600;
  const w=baseW*trZoom;
  trbar.style.width=w+'px';
  const ip=trDur>0?trIn/trDur:0, op=trDur>0?trOut/trDur:1;
  document.getElementById('trhIn').style.left=(ip*w)+'px';
  document.getElementById('trhOut').style.left=(op*w)+'px';
  document.getElementById('trrange').style.left=(ip*w)+'px';
  document.getElementById('trrange').style.width=((op-ip)*w)+'px';
  // クリップ範囲の薄表示（=IN/OUTと同じだが視覚補助）
  document.getElementById('trclip').style.left=(ip*w)+'px';
  document.getElementById('trclip').style.width=((op-ip)*w)+'px';
  document.getElementById('lbIn').textContent=ft(trIn);
  document.getElementById('lbOut').textContent=ft(trOut);
  // 再生ヘッドも更新
  const ph=document.getElementById('trph');
  if(ph && trDur>0) ph.style.left=((trv.currentTime/trDur)*w)+'px';
}
function updTrimInfo(){document.getElementById('tcif').textContent=`IN:${ft(trIn)} OUT:${ft(trOut)} (${(trOut-trIn).toFixed(1)}s)`;}

// 時間軸ズーム（Z=拡大, X=縮小）。注目点（再生ヘッド）が見える位置にスクロール。
function trimZoom(dir){
  const old=trZoom;
  if(dir>0) trZoom=Math.min(8, trZoom*1.6);
  else trZoom=Math.max(1, trZoom/1.6);
  if(trZoom===old) return;
  updTrimBar(); renderSlow();
  // 再生ヘッド（または IN）が中央に来るようスクロール
  const wrap=document.getElementById('trbarwrap');
  if(wrap){
    const focus = (trDur>0) ? (trv.currentTime/trDur) : (trIn/trDur);
    const target = focus*trbar.clientWidth - wrap.clientWidth/2;
    wrap.scrollLeft = Math.max(0, target);
  }
}

// IN/OUT点へジャンプ（再生位置を移動）
function trimJumpIn(){ trv.currentTime=trIn; scrollToPlayhead(); }
function trimJumpOut(){ trv.currentTime=Math.max(0,trOut-0.05); scrollToPlayhead(); }

// IN/OUTを1コマ単位で送る/戻す（which='in'|'out', dir=+1|-1）
function trimNudge(which, dir){
  const step=TRIM_FRAME*dir;
  if(which==='in'){
    trIn=Math.max(0, Math.min(trOut-TRIM_FRAME, trIn+step));
    trv.currentTime=trIn;
  } else {
    trOut=Math.max(trIn+TRIM_FRAME, Math.min(trDur, trOut+step));
    trv.currentTime=Math.max(0,trOut-0.05);
  }
  updTrimBar(); updTrimInfo(); scrollToPlayhead();
}

function scrollToPlayhead(){
  const wrap=document.getElementById('trbarwrap');
  if(!wrap||trDur<=0) return;
  const x=(trv.currentTime/trDur)*trbar.clientWidth;
  if(x < wrap.scrollLeft+20 || x > wrap.scrollLeft+wrap.clientWidth-20){
    wrap.scrollLeft=Math.max(0, x - wrap.clientWidth/2);
  }
}

// スロー区間の描画
function renderSlow(){
  const layer=document.getElementById('trslowlayer');
  layer.innerHTML='';
  const w=trbar.clientWidth;
  trSlow.forEach(rg=>{
    const d=document.createElement('div');
    d.className='slowseg';
    d.style.left=(rg.start/trDur*w)+'px';
    d.style.width=((rg.end-rg.start)/trDur*w)+'px';
    layer.appendChild(d);
  });
  // 情報表示
  if(trSlow.length===0){
    document.getElementById('slowInfo').textContent = slowPendingStart!==null
      ? `スロー開始:${ft(slowPendingStart)} → 終了点を指定` : '区間:なし';
  } else {
    const total=trSlow.reduce((s,r)=>s+(r.end-r.start),0);
    document.getElementById('slowInfo').textContent=`スロー${trSlow.length}区間 計${total.toFixed(1)}s`;
  }
}

// スロー開始点を現在の再生位置に設定
function slowSetStart(){
  slowPendingStart=Math.max(trIn, Math.min(trv.currentTime, trOut));
  renderSlow();
}
// スロー終了点を設定して区間を確定
function slowSetEnd(){
  if(slowPendingStart===null) return alert('先に「スロー開始点」を指定してください');
  let end=Math.max(trIn, Math.min(trv.currentTime, trOut));
  let start=slowPendingStart;
  if(end<start){ [start,end]=[end,start]; }
  if(end-start<0.2) return alert('区間が短すぎます');
  trSlow.push({start,end});
  trSlow.sort((a,b)=>a.start-b.start);
  slowPendingStart=null;
  renderSlow();
}
function slowClear(){ trSlow=[]; slowPendingStart=null; renderSlow(); }

document.getElementById('trhIn').addEventListener('mousedown',e=>{trDrag='in';e.preventDefault();});
document.getElementById('trhOut').addEventListener('mousedown',e=>{trDrag='out';e.preventDefault();});
document.addEventListener('mousemove',e=>{
  if(!trDrag) return;
  const rect=trbar.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  const sec=pct*trDur;
  if(trDrag==='in') trIn=Math.max(0, Math.min(sec,trOut-0.3));
  else              trOut=Math.min(trDur, Math.max(sec,trIn+0.3));
  trv.currentTime=trDrag==='in'?trIn:trOut;
  updTrimBar(); updTrimInfo(); renderSlow();
});
document.addEventListener('mouseup',()=>{trDrag=null;});
trbar.addEventListener('click',e=>{
  if(trDrag) return;
  const rect=trbar.getBoundingClientRect();
  trv.currentTime=Math.max(0,Math.min(trDur,(e.clientX-rect.left)/rect.width*trDur));
});
trv.addEventListener('timeupdate',()=>{
  const pct=trDur>0?trv.currentTime/trDur:0;
  document.getElementById('trph').style.left=(trbar.clientWidth*Math.max(0,Math.min(1,pct)))+'px';
  document.getElementById('trvt').textContent=ft(trv.currentTime);
  if(trv.currentTime>=trOut) trv.pause();
});
function trimPlay(){
  if(trv.paused){if(trv.currentTime<trIn||trv.currentTime>=trOut) trv.currentTime=trIn; trv.play(); document.getElementById('tcpl').textContent='■ 停止';}
  else{trv.pause();document.getElementById('tcpl').textContent='▶ 再生';}
}
trv.addEventListener('pause',()=>document.getElementById('tcpl').textContent='▶ 再生');
trv.addEventListener('play', ()=>document.getElementById('tcpl').textContent='■ 停止');
function trimSetIn(){trIn=Math.max(0,Math.min(trv.currentTime,trOut-0.3));updTrimBar();updTrimInfo();renderSlow();}
function trimSetOut(){trOut=Math.max(trIn+0.3,Math.min(trv.currentTime,trDur));updTrimBar();updTrimInfo();renderSlow();}

function applyTrim(){
  const c=clips.find(c=>c.id===trId); if(!c) return;
  // セグメント相対 → 録画絶対秒
  c.inSec  = trSegStart + trIn;
  c.outSec = trSegStart + trOut;
  c.duration = trOut - trIn;

  // スロー区間をクリップ相対(0=新IN)に変換し、範囲内にクランプ
  c.slowRegions = trSlow
    .map(rg=>({start: rg.start - trIn, end: rg.end - trIn}))
    .map(rg=>({start: Math.max(0, rg.start), end: Math.min(c.duration, rg.end)}))
    .filter(rg=>rg.end>rg.start);
  c.slowRate = parseFloat(document.getElementById('slowRate').value) || 2;
  // スロー区間があれば旧式の全体スローフラグは解除
  c.slow = (c.slowRegions.length>0) ? false : c.slow;

  // 新INが属するセグメントに参照を更新（次回トリムを正しく中心化するため）
  let ns=null;
  for(let i=segLog.length-1;i>=0;i--){ if(segLog[i].startSec<=c.inSec){ ns=segLog[i]; break; } }
  if(ns){ c.segIndex=ns.index; c.segStartSec=ns.startSec; if(ns.path) c.segPath=ns.path; }

  ipcRenderer.invoke('delete-preview',c.id);
  delete extractCache[c.id];
  delete extractInflight[c.id];
  closeTrim(); renderClips();
}

// ── REC保存先選択 ──
async function chooseFolder(){
  if(isRec) return alert('録画中は変更できません。STOPしてから選択してください。');
  const r=await ipcRenderer.invoke('choose-base-dir');
  if(r.canceled) return;
  alert('録画の保存先を変更しました:\n'+r.baseDir);

// ── 書き出し ──
async function doExport(){

  else alert('❌ 失敗: '+(r.error||'不明なエラー'));

function ft(s){
  s=Math.max(0,Math.floor(s||0));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ── キーボードショートカット ──
// I=IN, O=OUT（登録）, Space=プレビュー再生/停止
document.addEventListener('keydown', (e)=>{
  // 入力欄での入力中は無効化
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||e.target.isContentEditable) return;
  // トリム画面が開いている時はトリム側の操作を優先（誤爆防止のためIN/OUTは無効）
  const trimOpen=document.getElementById('trm').classList.contains('on');

  const k=e.key.toLowerCase();
  if(trimOpen){
    // トリム画面のショートカット
    if(k==='z'){ e.preventDefault(); trimZoom(-1); return; }
    if(k==='x'){ e.preventDefault(); trimZoom(1); return; }
    if(e.code==='Space'){ e.preventDefault(); trimPlay(); return; }
    if(e.key==='ArrowLeft'){ e.preventDefault(); trimNudge(e.shiftKey?'out':'in', -1); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); trimNudge(e.shiftKey?'out':'in', 1); return; }
    return;
  }
  if(k==='r'){
    e.preventDefault(); toggleRec();
  } else if(k==='i'){
    e.preventDefault(); setIn();
  } else if(k==='o'){
    e.preventDefault(); setOut();
  } else if(k==='z'){
    e.preventDefault(); tlZoom(-1);
  } else if(k==='x'){
    e.preventDefault(); tlZoom(1);
  } else if(e.code==='Space'){
    // スペースで全再生（選択クリップから）。再生中なら一時停止/再開。
    e.preventDefault();
    if(playing){ pvPause(); }
    else { playAll(); }
  }
});
