<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12172B">
<title>動画を投稿する</title>
<!--
  Event Digest / 投稿ページ (Component A)
  BUILD: 2026-08-02b  (🔴ぼかしてほしい人モードを追加。モードごとに丸の当たり判定を分離)
  Firebase 設定は反映済み。文言の変更は APP_CONFIG.texts で。
-->
<style>
  :root{
    --ink:#12172B;
    --ink-2:#1B2240;
    --ink-3:#262E52;
    --line:rgba(255,255,255,.10);
    --amber:#F2B138;
    --amber-soft:#FFD98A;
    --light:#E9EBF3;
    --muted:#8990AE;
    --good:#5FC793;
    --bad:#FF7A6B;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    background-image:radial-gradient(120% 60% at 50% -10%, rgba(242,177,56,.16) 0%, rgba(242,177,56,0) 60%);
    background-repeat:no-repeat;
    color:var(--light);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic Medium",sans-serif;
    line-height:1.7;
    min-height:100vh;
    min-height:100dvh;
    padding:0 20px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:460px;margin:0 auto}

  /* ---- header ---- */
  .eyebrow{
    margin:36px 0 0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--amber);font-weight:700;
  }
  h1{
    margin:10px 0 0;font-size:31px;line-height:1.35;font-weight:800;letter-spacing:-.01em;
  }
  h1 .accent{color:var(--amber)}
  .lead{margin:14px 0 0;color:var(--muted);font-size:14px}

  /* ---- signature: upload dial ---- */
  .modeToggle{display:flex;gap:8px;justify-content:center;margin:30px 0 0}
  .modeBtn{
    padding:9px 18px;border-radius:999px;border:1px solid var(--line);
    background:var(--ink-2);color:var(--muted);font-size:13px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .modeBtn.on{background:var(--amber);color:#241802;border-color:transparent}

  .dial{

    position:relative;width:196px;height:196px;margin:34px auto 0;
    display:block;border:0;padding:0;background:none;cursor:pointer;
    -webkit-user-select:none;user-select:none;
  }
  /* iOS Safari 対策: display:none にせず、画面外に置いて実体を残す */
  .visually-hidden{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }
  .dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .dial .track{fill:none;stroke:var(--ink-3);stroke-width:6}
  .dial .fill{
    fill:none;stroke:var(--amber);stroke-width:6;stroke-linecap:round;
    stroke-dasharray:590;stroke-dashoffset:590;
    transition:stroke-dashoffset .25s linear;
  }
  .dial-face{
    position:absolute;inset:16px;border-radius:50%;
    background:var(--ink-2);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:16px;text-align:center;
  }
  .dial-glyph{font-size:30px;line-height:1}
  .dial-label{font-size:14px;font-weight:700;color:var(--light)}
  .dial-sub{font-size:11px;color:var(--muted);word-break:break-all;line-height:1.5}
  .dial-pct{font-size:34px;font-weight:800;color:var(--amber);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .dial.is-disabled{cursor:default;opacity:.55}
  .dial.is-busy{cursor:progress}
  .dial:focus-within .dial-face{outline:2px solid var(--amber);outline-offset:2px}

  /* ---- 顔ぼかし指定(任意) ---- */
  .blurSec{margin-top:22px;display:none}
  .blurSec.show{display:block}
  .blurSec .blurHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .blurSec .blurTitle{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .blurSec .blurReset{
    background:none;border:0;color:var(--amber-soft);font-size:12px;font-family:inherit;
    cursor:pointer;padding:2px 0;text-decoration:underline;
  }
  .blurSec .blurReset:disabled{color:var(--muted);text-decoration:none;cursor:default}
  .blurModeRow{display:flex;gap:8px;margin-bottom:9px}
  .blurModeBtn{
    flex:1;padding:8px 6px;border-radius:9px;border:1px solid var(--line);
    background:transparent;color:var(--light);font-family:inherit;font-size:12.5px;font-weight:700;
    cursor:pointer;
  }
  .blurModeBtn.on{background:var(--amber);border-color:var(--amber);color:#1a1200}
  .blurModeBtn.on.danger{background:#E5484D;border-color:#E5484D;color:#fff}
  .blurStage{
    position:relative;width:100%;border-radius:12px;overflow:hidden;
    background:var(--ink-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;min-height:120px;
  }
  .blurStage canvas{width:100%;display:block;touch-action:none}
  .blurStage .blurLoading{position:absolute;color:var(--muted);font-size:12px}
  .blurHint{margin:8px 0 0;font-size:11px;color:var(--muted);line-height:1.6}
  .blurCount{font-size:11px;color:var(--amber-soft);font-weight:700}

  .scrubRow{display:none;align-items:center;gap:10px;margin-top:10px}
  .scrubRow.show{display:flex}
  .scrubLabel{font-size:11px;color:var(--muted);white-space:nowrap;flex:none}
  .scrubRow input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
    background:var(--ink-3);outline:none;margin:0;
  }
  .scrubRow input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--amber);border:2px solid var(--ink);cursor:pointer;
  }
  .scrubRow input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;background:var(--amber);border:2px solid var(--ink);cursor:pointer;
  }

  /* ---- form ---- */
  .field{margin-top:26px}
  label.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:.04em}
  input[type=text]{
    width:100%;padding:14px 15px;font-size:16px;color:var(--light);
    background:var(--ink-2);border:1px solid var(--line);border-radius:12px;
    font-family:inherit;
  }
  input[type=text]:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
  .hint{margin:7px 0 0;font-size:11px;color:var(--muted)}

  .consent{
    display:flex;gap:11px;align-items:flex-start;margin-top:20px;
    background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:14px;
    cursor:pointer;
  }
  .consent input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--amber);flex:none}
  .consent span{font-size:13px;line-height:1.6}

  .btn{
    width:100%;margin-top:18px;padding:17px;border:0;border-radius:13px;
    background:var(--amber);color:#241802;font-size:16px;font-weight:800;
    font-family:inherit;cursor:pointer;letter-spacing:.02em;
  }
  .btn:disabled{background:var(--ink-3);color:var(--muted);cursor:default}
  .btn:focus-visible{outline:2px solid var(--amber-soft);outline-offset:2px}

  /* ---- posted list ---- */
  .sec-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin:34px 0 12px;padding-top:22px;border-top:1px solid var(--line);
  }
  .sec-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
  .count{font-size:13px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums}
  .item{
    display:flex;align-items:center;gap:12px;
    background:var(--ink-2);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;margin-bottom:9px;
  }
  .item-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
  .item-body{flex:1;min-width:0}
  .item-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-meta{font-size:11px;color:var(--muted)}
  .item-del{
    background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer;font-family:inherit;flex:none;
  }
  .empty{color:var(--muted);font-size:13px;padding:4px 0 2px}

  /* ---- notes ---- */
  details{margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
  summary{font-size:12px;color:var(--muted);cursor:pointer;font-weight:700;letter-spacing:.04em}
  details ul{margin:14px 0 0;padding-left:18px}
  details li{font-size:12px;color:var(--muted);margin-bottom:9px;line-height:1.65}

  /* ---- states ---- */
  .msg{margin-top:16px;padding:13px 14px;border-radius:12px;font-size:13px;display:none;line-height:1.6}
  .msg.show{display:block}
  .msg.ok{background:rgba(95,199,147,.12);color:var(--good);border:1px solid rgba(95,199,147,.3)}
  .msg.err{background:rgba(255,122,107,.12);color:var(--bad);border:1px solid rgba(255,122,107,.3)}
  .msg.warn{background:rgba(242,177,56,.10);color:var(--amber-soft);border:1px solid rgba(242,177,56,.28)}

  .screen{display:none;padding:80px 0;text-align:center}
  .screen.show{display:block}
  .screen h2{font-size:23px;margin:0 0 12px}
  .screen p{color:var(--muted);font-size:14px;margin:0}
  #app.hidden,#loading.hidden{display:none}
  #loading{padding:100px 0;text-align:center;color:var(--muted);font-size:13px}

  @media (prefers-reduced-motion:reduce){
    .dial .fill{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading">読み込んでいます…</div>

  <!-- 受付終了 -->
  <div class="screen" id="closed">
    <h2 id="closedTitle"></h2>
    <p id="closedBody"></p>
  </div>

  <!-- 本体 -->
  <main id="app" class="hidden">
    <p class="eyebrow" id="eventName"></p>
    <h1 id="heading"></h1>
    <p class="lead" id="lead"></p>

    <input type="file" id="fileVideo" accept="video/*" class="visually-hidden">
    <input type="file" id="filePhoto" accept="image/*" class="visually-hidden">

    <div class="modeToggle" id="modeToggle">
      <button type="button" class="modeBtn on" data-mode="video">🎬 動画</button>
      <button type="button" class="modeBtn" data-mode="photo">🖼 写真</button>
    </div>

    <label class="dial" id="dial" for="fileVideo">
      <svg viewBox="0 0 196 196" aria-hidden="true">
        <circle class="track" cx="98" cy="98" r="94"></circle>
        <circle class="fill" id="ring" cx="98" cy="98" r="94"></circle>
      </svg>
      <span class="dial-face" id="dialFace">
        <span class="dial-glyph">＋</span>
        <span class="dial-label">動画を選ぶ</span>
        <span class="dial-sub">カメラロールから</span>
      </span>
    </label>

    <div class="blurSec" id="blurSec">
      <div class="blurHead">
        <span class="blurTitle" id="blurTitle"></span>
        <button type="button" class="blurReset" id="blurReset" disabled>指定をやり直す</button>
      </div>
      <div class="blurModeRow" id="blurModeRow">
        <button type="button" class="blurModeBtn on" id="blurModeKeep">🟠残す人</button>
        <button type="button" class="blurModeBtn" id="blurModeBlur">🔴ぼかしてほしい人</button>
      </div>
      <div class="blurStage" id="blurStage">
        <span class="blurLoading" id="blurLoading">画像を読み込み中…</span>
        <canvas id="blurCanvas"></canvas>
      </div>
      <div class="scrubRow" id="scrubRow">
        <span class="scrubLabel">サムネイルを選ぶ</span>
        <input type="range" id="scrubSlider" min="0" max="1000" value="0" step="1">
      </div>
      <p class="blurHint" id="blurHintText"></p>
    </div>

    <div class="field">
      <label class="lbl" for="nick">おなまえ（ニックネーム可）</label>
      <input type="text" id="nick" maxlength="20" placeholder="例：たけし" autocomplete="nickname">
      <p class="hint">エンドロールに表示されることがあります。本名でなくて構いません。</p>
    </div>

    <label class="consent">
      <input type="checkbox" id="consent">
      <span id="consentText"></span>
    </label>

    <button class="btn" id="send" disabled>投稿する</button>

    <div class="msg" id="msg"></div>

    <div class="sec-head">
      <h2>投稿済みの動画</h2>
      <span class="count" id="count">0 / 3</span>
    </div>
    <div id="list"><p class="empty">まだ投稿はありません。</p></div>

    <details>
      <summary>個人情報の取り扱いについて</summary>
      <ul id="notes"></ul>
    </details>
  </main>
</div>

<script type="module">
// ============================================================
// ★ APP_CONFIG ── ここだけ書き換えてください
// ============================================================
const APP_CONFIG = {
  // 受付中のイベントは受信デーモンが Firebase に書き込むので、
  // 通常はこの値を書き換える必要はありません（取得できないときの控えです）
  eventId: "test-001",

  // Firebase コンソール → プロジェクトの設定 → マイアプリ（ウェブ）の設定値
  firebase: {
    apiKey:            "AIzaSyBuHIvsRF9UtT14m14-qWR--aVMKl7XAhw",
    authDomain:        "event-digest-e9565.firebaseapp.com",
    databaseURL:       "https://event-digest-e9565-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "event-digest-e9565",
    storageBucket:     "event-digest-e9565.firebasestorage.app",
    messagingSenderId: "791344995733",
    appId:             "1:791344995733:web:adbca1acd6d871c8576a9c"
  },

  maxFiles: 3,
  maxFileSizeMB: 2048,       // 安全弁。通常の投稿では発火しません
  largeFileWarnMB: 300,      // これを超えたら「時間がかかります」と表示

  texts: {
    eventName: "AVA SUMMER PARTY 2026",
    heading: '今日のいちばんを、<span class="accent">1本</span>。',
    lead: "本日撮影された動画または写真の中から、いちばん印象に残った1点をご投稿ください。エンディング映像の素材として使わせていただきます。",
    consent: "投稿した動画・写真が、本日のエンディング映像の制作に使用されることに同意します。",
    notes: [
      "お預かりした動画は、本イベントのエンディング映像制作を目的として使用いたします。",
      "動画に他の参加者が映り込んでいる場合は、その方の了解が得られる範囲でのご投稿をお願いいたします。",
      "元の動画素材は、イベント終了後30日以内に削除いたします。",
      "完成した映像の当日上映以降の取り扱い（社内での共有・記録保存・広報活動等）につきましては、主催者の判断によるものとします。",
      "ご入力いただいたニックネームは、映像のエンドロールに表示される場合があります。"
    ],
    closedTitle: "受付は終了しました",
    closedBody: "たくさんのご投稿をありがとうございました。エンディングをお楽しみに。",
    blurTitle: "顔の指定はありますか？（任意）",
    blurHint: "🟠残す人（主役）と、🔴ぼかしてほしい人を、上のボタンで切り替えてタップで指定できます。丸はドラッグで位置を、指2本でつまむと大きさを調整できます。何も指定しなければ、これまで通り誰もぼかさずに投稿されます。ダブルタップで指定を解除できます。"
  }
};

// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref as dbRef, set, remove, get, onValue, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { getStorage, ref as stRef, uploadBytesResumable, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const T = APP_CONFIG.texts;
let EV = APP_CONFIG.eventId;   // 起動時に Firebase の値で上書きされます
let MAX_FILES = APP_CONFIG.maxFiles;   // 同上。無制限のときは非常に大きな値になる

// QR に ?e=イベントID が付いていれば拾う（ポスターの区別用）
const QR_EVENT = (new URLSearchParams(location.search).get('e') || '').trim();
const MAX_BYTES = APP_CONFIG.maxFileSizeMB * 1024 * 1024;
const WARN_BYTES = APP_CONFIG.largeFileWarnMB * 1024 * 1024;

const $ = (id) => document.getElementById(id);
const el = {
  loading:$("loading"), app:$("app"), closed:$("closed"),
  eventName:$("eventName"), heading:$("heading"), lead:$("lead"),
  dial:$("dial"), dialFace:$("dialFace"), ring:$("ring"),
  fileVideo:$("fileVideo"), filePhoto:$("filePhoto"),
  nick:$("nick"), consent:$("consent"), consentText:$("consentText"),
  send:$("send"), msg:$("msg"), list:$("list"), count:$("count"), notes:$("notes"),
  closedTitle:$("closedTitle"), closedBody:$("closedBody"),
  blurSec:$("blurSec"), blurTitle:$("blurTitle"), blurReset:$("blurReset"),
  blurModeKeep:$("blurModeKeep"), blurModeBlur:$("blurModeBlur"),
  blurStage:$("blurStage"), blurLoading:$("blurLoading"),
  blurCanvas:$("blurCanvas"), blurHintText:$("blurHintText"),
  scrubRow:$("scrubRow"), scrubSlider:$("scrubSlider")
};

// ---- 文言の流し込み ----
el.eventName.textContent = T.eventName;
el.heading.innerHTML = T.heading;
el.lead.textContent = T.lead;
el.consentText.textContent = T.consent;
el.closedTitle.textContent = T.closedTitle;
el.closedBody.textContent = T.closedBody;
el.blurTitle.textContent = T.blurTitle;
el.blurHintText.textContent = T.blurHint;
el.notes.innerHTML = T.notes.map((n) => `<li></li>`).join("");
[...el.notes.children].forEach((li, i) => { li.textContent = T.notes[i]; });

// ---- 状態 ----
let uid = null;
let db = null, storage = null;
let picked = null;
let uploading = false;
let mine = {};      // uploadId -> { fileName, storagePath, at }
let isClosed = false;

// ---- 顔ぼかし指定(任意) ----
let blurMarks = [];         // [{ xRatio, yRatio, rRatio, mode: 'keep'|'blur' }]
let blurMode = "keep";      // 今タップすると付くモード
let blurFrameToken = 0;     // 選び直しの競合を防ぐための連番
const BLUR_MARK_RATIO = 0.16;   // 新規タップ時の既定サイズ(フレーム短辺に対する割合)
const BLUR_MARK_MIN = 0.05;     // ピンチで縮小できる下限
const BLUR_MARK_MAX = 0.55;     // ピンチで拡大できる上限
let pinchState = null;      // { markIndex, startDist, startRatio }
let scrubVideo = null;      // サムネイル選び用に保持しておく<video>要素
let scrubVideoUrl = null;
let scrubSeeking = false;
let scrubPendingRatio = null;   // シーク中に来た次の要求(1回だけ後で反映する)

// ---- ユーティリティ ----
function mb(bytes){
  if (bytes >= 1024*1024*1024) return (bytes/1024/1024/1024).toFixed(1) + " GB";
  return Math.round(bytes/1024/1024) + " MB";
}
function showMsg(text, kind){
  el.msg.textContent = text;
  el.msg.className = "msg show " + (kind || "warn");
}
function clearMsg(){ el.msg.className = "msg"; }
function setRing(pct){
  const C = 590;
  el.ring.style.strokeDashoffset = String(C - C * Math.max(0, Math.min(1, pct)));
}
function faceIdle(){
  const label = pickMode === "photo" ? "写真を選ぶ" : "動画を選ぶ";
  el.dialFace.innerHTML =
    '<span class="dial-glyph">＋</span>' +
    '<span class="dial-label">' + label + '</span>' +
    '<span class="dial-sub">カメラロールから</span>';
  setRing(0);
}
function isImage(f){ return !!(f && f.type && f.type.indexOf('image/') === 0); }

function facePicked(name, size, still){
  el.dialFace.innerHTML = '<span class="dial-glyph">' + (still ? '🖼' : '🎬') + '</span>' +
    '<span class="dial-label">選択中</span><span class="dial-sub"></span>';
  el.dialFace.querySelector(".dial-sub").textContent = name + " / " + mb(size);
  setRing(0);
}
function faceProgress(pct){
  if (!el.dialFace.querySelector(".dial-pct")) {
    el.dialFace.innerHTML = '<span class="dial-pct">0%</span><span class="dial-sub">送信中…</span>';
  }
  el.dialFace.querySelector(".dial-pct").textContent = Math.round(pct*100) + "%";
  setRing(pct);
}
function facePreparing(){
  el.dialFace.innerHTML = '<span class="dial-glyph">⋯</span><span class="dial-label">準備中</span>' +
    '<span class="dial-sub">そのままお待ちください</span>';
}
function faceDone(){
  el.dialFace.innerHTML = '<span class="dial-glyph">✓</span><span class="dial-label">送信できました</span>' +
    '<span class="dial-sub">ありがとうございます</span>';
  setRing(1);
}

// ---- 顔ぼかし指定(任意) ----
// 選んだ動画/写真から1コマだけ切り出してキャンバスに表示し、
// タップされた位置を中心に小さな参照画像を作る。ここでは「顔検出」はせず、
// 単純にタップ位置周辺を切り出すだけ(検出・照合は受信側で行う想定)。

function cleanupScrubVideo(){
  if (scrubVideo) { try { scrubVideo.remove(); } catch (_e) { /* noop */ } }
  if (scrubVideoUrl) { try { URL.revokeObjectURL(scrubVideoUrl); } catch (_e) { /* noop */ } }
  scrubVideo = null;
  scrubVideoUrl = null;
  scrubSeeking = false;
  scrubPendingRatio = null;
}

function setBlurMode(mode){
  blurMode = mode;
  if (mode === "keep"){
    el.blurModeKeep.classList.add("on"); el.blurModeKeep.classList.remove("danger");
    el.blurModeBlur.classList.remove("on"); el.blurModeBlur.classList.remove("danger");
  } else {
    el.blurModeBlur.classList.add("on"); el.blurModeBlur.classList.add("danger");
    el.blurModeKeep.classList.remove("on");
  }
}

function resetBlurUI(){
  blurMarks = [];
  setBlurMode("keep");
  el.blurSec.classList.remove("show");
  el.blurReset.disabled = true;
  const ctx = el.blurCanvas.getContext("2d");
  if (ctx) ctx.clearRect(0, 0, el.blurCanvas.width, el.blurCanvas.height);
  el.blurCanvas.__baseFrame = null;
  el.blurCanvas.__ready = false;
  el.blurLoading.style.display = "";
  el.blurLoading.textContent = "画像を読み込み中…";
  el.blurHintText.textContent = T.blurHint;
  el.scrubRow.classList.remove("show");
  el.scrubSlider.value = "0";
  cleanupScrubVideo();
}

function updateBlurHint(){
  const base = T.blurHint;
  const keepN = blurMarks.filter((m) => m.mode !== "blur").length;
  const blurN = blurMarks.filter((m) => m.mode === "blur").length;
  const parts = [];
  if (keepN) parts.push(`🟠残す人 ${keepN}名`);
  if (blurN) parts.push(`🔴ぼかしてほしい人 ${blurN}名`);
  el.blurHintText.textContent = parts.length ? base + `（${parts.join(" / ")}を指定中）` : base;
  el.blurReset.disabled = blurMarks.length === 0;
}

function redrawBlurMarks(){
  const canvas = el.blurCanvas;
  const ctx = canvas.getContext("2d");
  if (canvas.__baseFrame) ctx.putImageData(canvas.__baseFrame, 0, 0);
  const minSide = Math.min(canvas.width, canvas.height);
  blurMarks.forEach((m) => {
    const cx = m.xRatio * canvas.width;
    const cy = m.yRatio * canvas.height;
    const r = (minSide * (m.rRatio || BLUR_MARK_RATIO)) / 2;
    const isBlur = m.mode === "blur";
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = isBlur ? "rgba(229,72,77,.30)" : "rgba(242,177,56,.28)";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = isBlur ? "#E5484D" : "#F2B138";
    ctx.stroke();
  });
}

// 選んだファイルから1コマ抜き出してキャンバスにセットする
function prepareBlurStage(file){
  const myToken = ++blurFrameToken;
  resetBlurUI();
  el.blurSec.classList.add("show");

  const finish = (drawFn, w, h) => {
    if (myToken !== blurFrameToken) return; // 途中で別のファイルに変わっていたら破棄
    const canvas = el.blurCanvas;
    const maxW = 460;
    const scale = Math.min(1, maxW / w);
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    drawFn();
    canvas.__baseFrame = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
    el.blurLoading.style.display = "none";
    canvas.__ready = true;
  };

  const giveUp = (msg) => {
    if (myToken !== blurFrameToken) return;
    el.blurSec.classList.remove("show");   // 失敗時はセクションごと隠し、投稿の妨げにしない
    el.blurLoading.textContent = "";
    if (msg) showMsg(msg, "warn");
  };

  if (isImage(file)){
    const img = new Image();
    const url = URL.createObjectURL(file);
    const imgTimer = setTimeout(() => {
      giveUp("プレビューを表示できませんでしたが、そのまま投稿できます。");
      URL.revokeObjectURL(url);
    }, 8000);
    img.onload = () => {
      clearTimeout(imgTimer);
      finish(() => el.blurCanvas.getContext("2d").drawImage(img, 0, 0, el.blurCanvas.width, el.blurCanvas.height),
             img.naturalWidth, img.naturalHeight);
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { clearTimeout(imgTimer); giveUp("プレビューを表示できませんでしたが、そのまま投稿できます。"); URL.revokeObjectURL(url); };
    img.src = url;
  } else {
    // iOS Safari 対策: video要素をDOMに実際に追加しないと
    // loadedmetadata / seeked が発火しないことがあるため、画面外に配置して追加する。
    const video = document.createElement("video");
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.setAttribute("playsinline", "");
    video.setAttribute("muted", "");
    video.preload = "auto";
    video.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;top:-9999px";
    document.body.appendChild(video);

    const url = URL.createObjectURL(file);
    let seeked = false;

    const cleanupOnFail = () => {
      URL.revokeObjectURL(url);
      video.remove();
    };

    const timer = setTimeout(() => {
      if (myToken !== blurFrameToken || seeked) return;
      giveUp("プレビューを表示できませんでしたが、そのまま投稿できます。");
      cleanupOnFail();
    }, 8000);

    video.addEventListener("loadedmetadata", () => {
      if (myToken !== blurFrameToken) return;
      const d = video.duration;
      video.currentTime = (isFinite(d) && d > 0) ? Math.min(1, d / 2) : 0.1;
    });
    video.addEventListener("seeked", () => {
      if (seeked) return; // 一部端末で複数回発火することがあるため一度だけ処理
      seeked = true;
      clearTimeout(timer);
      finish(() => el.blurCanvas.getContext("2d").drawImage(video, 0, 0, el.blurCanvas.width, el.blurCanvas.height),
             video.videoWidth, video.videoHeight);
      // 動画は破棄せず、サムネイル選び(スクラブ)用に保持しておく
      scrubVideo = video;
      scrubVideoUrl = url;
      const d = video.duration;
      if (isFinite(d) && d > 0){
        el.scrubSlider.value = String(Math.round((video.currentTime / d) * 1000));
        el.scrubRow.classList.add("show");
      }
    });
    video.addEventListener("error", () => {
      clearTimeout(timer);
      giveUp("プレビューを表示できませんでしたが、そのまま投稿できます。");
      cleanupOnFail();
    });
    video.src = url;
    video.load();
  }
}

// サムネイル選びのスライダー操作
function seekScrubTo(ratio){
  if (!scrubVideo) return;
  const d = scrubVideo.duration;
  if (!isFinite(d) || d <= 0) return;

  if (scrubSeeking){
    scrubPendingRatio = ratio;   // シーク中に来た分は1回だけ後で反映
    return;
  }
  scrubSeeking = true;

  const onSeeked = () => {
    scrubVideo.removeEventListener("seeked", onSeeked);
    const canvas = el.blurCanvas;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(scrubVideo, 0, 0, canvas.width, canvas.height);
    canvas.__baseFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    // フレームが変わったので、それまでの位置指定はリセットする
    blurMarks = [];
    redrawBlurMarks();
    updateBlurHint();
    scrubSeeking = false;

    if (scrubPendingRatio !== null){
      const next = scrubPendingRatio;
      scrubPendingRatio = null;
      seekScrubTo(next);
    }
  };
  scrubVideo.addEventListener("seeked", onSeeked);
  scrubVideo.currentTime = Math.max(0, Math.min(d, d * ratio));
}

el.scrubSlider.addEventListener("input", () => {
  if (!scrubVideo || !el.blurCanvas.__ready) return;
  seekScrubTo(Number(el.scrubSlider.value) / 1000);
});

// ---- タップ(追加) / ドラッグ(位置調整) / ダブルタップ(削除) / ピンチ(大きさ調整) ----
function touchPointRatio(t, rect){
  return { xRatio: (t.clientX - rect.left) / rect.width, yRatio: (t.clientY - rect.top) / rect.height };
}
function touchDist(t1, t2){
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}
// 今選んでいるモード(🟠/🔴)の丸だけを操作対象にする(別レイヤーのように衝突しないようにするため)
function nearestMarkIndex(xRatio, yRatio, toleranceMult){
  let best = -1, bestDist = Infinity;
  blurMarks.forEach((m, i) => {
    if ((m.mode || "keep") !== blurMode) return;
    const d = Math.hypot(m.xRatio - xRatio, m.yRatio - yRatio);
    if (d < bestDist){ bestDist = d; best = i; }
  });
  // 極端に離れた場所でのピンチ・タップは対象なしとする
  return (best >= 0 && bestDist < (blurMarks[best].rRatio || BLUR_MARK_RATIO) * toleranceMult) ? best : -1;
}

let lastTapInfo = null;   // { markIndex, time } ダブルタップ判定用
let dragState = null;     // { markIndex, moved } 1本指ドラッグ中の状態
const DOUBLE_TAP_MS = 350;
const DRAG_MOVE_THRESHOLD = 0.015;   // これ以上動いたら「タップ」ではなく「ドラッグ」とみなす

const HAS_TOUCH = ("ontouchstart" in window);

el.blurModeKeep.addEventListener("click", () => setBlurMode("keep"));
el.blurModeBlur.addEventListener("click", () => setBlurMode("blur"));

if (HAS_TOUCH){
  el.blurCanvas.addEventListener("touchstart", (e) => {
    if (!el.blurCanvas.__ready) return;
    const rect = el.blurCanvas.getBoundingClientRect();

    if (e.touches.length === 2){
      dragState = null;
      if (blurMarks.length === 0) return;
      const [t1, t2] = e.touches;
      const mid = touchPointRatio({ clientX: (t1.clientX + t2.clientX) / 2, clientY: (t1.clientY + t2.clientY) / 2 }, rect);
      const idx = nearestMarkIndex(mid.xRatio, mid.yRatio, 1.8);
      if (idx < 0) return;
      e.preventDefault();
      pinchState = { markIndex: idx, startDist: touchDist(t1, t2), startRatio: blurMarks[idx].rRatio || BLUR_MARK_RATIO };
      return;
    }

    if (e.touches.length !== 1) return;
    pinchState = null;
    const p = touchPointRatio(e.touches[0], rect);
    dragState = { markIndex: nearestMarkIndex(p.xRatio, p.yRatio, 0.7), moved: false };
  }, { passive: false });

  el.blurCanvas.addEventListener("touchmove", (e) => {
    const rect = el.blurCanvas.getBoundingClientRect();

    if (pinchState && e.touches.length === 2){
      e.preventDefault();
      const [t1, t2] = e.touches;
      const dist = touchDist(t1, t2);
      const scale = dist / pinchState.startDist;
      const next = Math.max(BLUR_MARK_MIN, Math.min(BLUR_MARK_MAX, pinchState.startRatio * scale));
      blurMarks[pinchState.markIndex].rRatio = next;
      redrawBlurMarks();
      return;
    }

    if (dragState && dragState.markIndex >= 0 && e.touches.length === 1){
      const p = touchPointRatio(e.touches[0], rect);
      const m = blurMarks[dragState.markIndex];
      const d = Math.hypot(p.xRatio - m.xRatio, p.yRatio - m.yRatio);
      if (dragState.moved || d > DRAG_MOVE_THRESHOLD){
        dragState.moved = true;
        e.preventDefault();
        m.xRatio = Math.max(0, Math.min(1, p.xRatio));
        m.yRatio = Math.max(0, Math.min(1, p.yRatio));
        redrawBlurMarks();
      }
    }
  }, { passive: false });

  el.blurCanvas.addEventListener("touchend", (e) => {
    if (pinchState){ endPinch(); return; }
    if (!dragState) return;
    const info = dragState;
    dragState = null;

    if (info.moved){
      updateBlurHint();   // ドラッグで位置調整しただけ。追加・削除はしない
      return;
    }

    const rect = el.blurCanvas.getBoundingClientRect();
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    const p = touchPointRatio(t, rect);

    if (info.markIndex >= 0){
      // 既存の丸をタップ → ダブルタップなら削除。シングルタップだけでは何もしない
      // (連続タップでの位置合わせを妨げないため)
      const now = Date.now();
      if (lastTapInfo && lastTapInfo.markIndex === info.markIndex && (now - lastTapInfo.time) < DOUBLE_TAP_MS){
        blurMarks.splice(info.markIndex, 1);
        redrawBlurMarks();
        updateBlurHint();
        lastTapInfo = null;
      } else {
        lastTapInfo = { markIndex: info.markIndex, time: now };
      }
    } else {
      // 何もない場所をタップ → 新規追加
      blurMarks.push({ xRatio: p.xRatio, yRatio: p.yRatio, rRatio: BLUR_MARK_RATIO, mode: blurMode });
      redrawBlurMarks();
      updateBlurHint();
      lastTapInfo = null;
    }
  }, { passive: true });

  el.blurCanvas.addEventListener("touchcancel", () => { dragState = null; endPinch(); });
} else {
  // タッチ非対応環境(PCブラウザでの確認用)向けの簡易フォールバック
  el.blurCanvas.addEventListener("click", (e) => {
    if (!el.blurCanvas.__ready) return;
    const rect = el.blurCanvas.getBoundingClientRect();
    const xRatio = (e.clientX - rect.left) / rect.width;
    const yRatio = (e.clientY - rect.top) / rect.height;
    const idx = nearestMarkIndex(xRatio, yRatio, 0.7);
    if (idx >= 0) blurMarks.splice(idx, 1);
    else blurMarks.push({ xRatio, yRatio, rRatio: BLUR_MARK_RATIO, mode: blurMode });
    redrawBlurMarks();
    updateBlurHint();
  });
}

function endPinch(){
  if (!pinchState) return;
  updateBlurHint();
  // click イベントの誤発火(ピンチ終了直後に合成clickが飛ぶ端末がある)を避けるため、
  // フラグはすぐに消さず少し遅らせて解除する。
  setTimeout(() => { pinchState = null; }, 300);
}

el.blurReset.addEventListener("click", () => {
  blurMarks = [];
  setBlurMode("keep");
  redrawBlurMarks();
  updateBlurHint();
});

// マーク周辺を切り出して小さなJPEGにする(参照用)
function cropMarkToBlob(mark){
  const canvas = el.blurCanvas;
  if (!canvas.__baseFrame) return Promise.resolve(null);

  // マーカー(丸)が写り込まないよう、クリーンな元フレームから切り出す
  const clean = document.createElement("canvas");
  clean.width = canvas.width; clean.height = canvas.height;
  clean.getContext("2d").putImageData(canvas.__baseFrame, 0, 0);

  const rRatio = mark.rRatio || BLUR_MARK_RATIO;
  const side = Math.min(canvas.width, canvas.height) * rRatio * 2;
  const sx = Math.max(0, mark.xRatio * canvas.width - side / 2);
  const sy = Math.max(0, mark.yRatio * canvas.height - side / 2);
  const sw = Math.min(side, canvas.width - sx);
  const sh = Math.min(side, canvas.height - sy);
  if (sw <= 0 || sh <= 0) return Promise.resolve(null);

  const out = document.createElement("canvas");
  out.width = 160; out.height = 160;
  const octx = out.getContext("2d");
  octx.drawImage(clean, sx, sy, sw, sh, 0, 0, 160, 160);
  return new Promise((resolve) => out.toBlob(resolve, "image/jpeg", 0.85));
}


let pickMode = "video";   // "video" か "photo"。ボタンで切り替える。

function currentInput(){ return pickMode === "photo" ? el.filePhoto : el.fileVideo; }

function setPickMode(mode){
  pickMode = mode;
  document.querySelectorAll(".modeBtn").forEach((b) => {
    b.classList.toggle("on", b.dataset.mode === mode);
  });
  el.dial.setAttribute("for", mode === "photo" ? "filePhoto" : "fileVideo");
  if (!uploading) faceIdle();
  picked = null;
  resetBlurUI();
  refreshSendButton();
}

function refreshDial(){
  const full = Object.keys(mine).length >= MAX_FILES;
  const block = uploading || isClosed || full;
  el.fileVideo.disabled = block;
  el.filePhoto.disabled = block;   // disabled な input はピッカーが開かない
  el.dial.classList.toggle("is-disabled", block);
}

function refreshSendButton(){
  const n = Object.keys(mine).length;
  el.send.disabled = !(picked && el.consent.checked && el.nick.value.trim() && !uploading
                       && n < MAX_FILES && !isClosed);
  refreshDial();
}

function renderList(){
  const ids = Object.keys(mine).sort();
  el.count.textContent = ids.length + " / " + (MAX_FILES >= 9999 ? "∞" : MAX_FILES);
  if (ids.length === 0){
    el.list.innerHTML = '<p class="empty">まだ投稿はありません。</p>';
    refreshSendButton();
    return;
  }
  el.list.innerHTML = "";
  ids.forEach((id) => {
    const it = mine[id];
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = '<span class="item-dot"></span><div class="item-body">' +
      '<div class="item-name"></div><div class="item-meta"></div></div>' +
      '<button class="item-del" type="button">取り消す</button>';
    row.querySelector(".item-name").textContent = it.fileName;
    row.querySelector(".item-meta").textContent = mb(it.bytes || 0) + " ・ 受付済み";
    row.querySelector(".item-del").addEventListener("click", () => removeUpload(id));
    el.list.appendChild(row);
  });
  refreshSendButton();
}

// ---- 投稿の取り消し ----
async function removeUpload(id){
  if (uploading) return;
  if (!confirm("この投稿を取り消しますか？")) return;
  const it = mine[id];
  try {
    await remove(dbRef(db, `events/${EV}/uploads/${id}`));
    await remove(dbRef(db, `events/${EV}/myUploads/${uid}/${id}`));
    try { await deleteObject(stRef(storage, it.storagePath)); } catch(e){ /* 既に無い場合は無視 */ }
    delete mine[id];
    renderList();
    showMsg("投稿を取り消しました。", "warn");
  } catch (e){
    showMsg("取り消しに失敗しました。通信環境をご確認のうえ、もう一度お試しください。", "err");
  }
}

// ---- ファイル選択 ----
// ラベルと input を for/id で結び付けているため、タップでピッカーが開きます。
// （iOS Safari では JS の .click() より確実です）
document.querySelectorAll(".modeBtn").forEach((b) => {
  b.addEventListener("click", () => setPickMode(b.dataset.mode));
});

el.dial.addEventListener("click", (e) => {
  if (currentInput().disabled){
    e.preventDefault();
    if (!uploading && !isClosed && Object.keys(mine).length >= MAX_FILES){
      showMsg(`投稿は${MAX_FILES}本までです。入れ替える場合は、下の一覧から取り消してください。`, "warn");
    }
    return;
  }
  clearMsg();
});

function onFileChosen(){
  const f = currentInput().files && currentInput().files[0];
  if (!f) return;
  clearMsg();
  if (f.size > MAX_BYTES){
    picked = null; faceIdle(); resetBlurUI();
    const kind = pickMode === "photo" ? "写真" : "動画";
    showMsg(`ファイルが大きすぎます（${mb(f.size)}）。${APP_CONFIG.maxFileSizeMB} MB までの${kind}をお選びください。`, "err");
    refreshSendButton();
    return;
  }
  picked = f;
  facePicked(f.name, f.size, isImage(f));
  prepareBlurStage(f);
  if (f.size > WARN_BYTES){
    showMsg(`${mb(f.size)}あります。送信に数分かかることがあります。完了表示が出るまで、この画面を開いたままお待ちください。`, "warn");
  }
  refreshSendButton();
}
el.fileVideo.addEventListener("change", onFileChosen);
el.filePhoto.addEventListener("change", onFileChosen);

el.nick.addEventListener("input", () => {
  localStorage.setItem("evdigest_nick", el.nick.value);
  refreshSendButton();
});
el.consent.addEventListener("change", refreshSendButton);

// ---- 送信 ----
el.send.addEventListener("click", () => {
  if (!picked || uploading) return;
  uploading = true;
  el.send.disabled = true;
  el.dial.classList.add("is-busy");
  clearMsg();
  facePreparing();

  const f = picked;
  const id = `${uid}_${Date.now()}`;
  const ext = (f.name.match(/\.[A-Za-z0-9]+$/) || [".mp4"])[0];
  const storagePath = `events/${EV}/uploads/${uid}/${id}${ext}`;
  const nickname = el.nick.value.trim();

  const task = uploadBytesResumable(
    stRef(storage, storagePath), f,
    { contentType: f.type || (isImage(f) ? "image/jpeg" : "video/mp4") }
  );

  window.onbeforeunload = () => "送信中です。画面を閉じると投稿が取り消されます。";

  task.on("state_changed",
    (snap) => { faceProgress(snap.bytesTransferred / snap.totalBytes); },
    (err) => {
      window.onbeforeunload = null;
      uploading = false;
      el.dial.classList.remove("is-busy");
      facePicked(f.name, f.size, isImage(f));
      const m = (err && err.code === "storage/unauthorized")
        ? "この形式またはサイズは受け付けられません。別の動画または写真をお試しください。"
        : "送信できませんでした。電波の良い場所で、もう一度お試しください。";
      showMsg(m, "err");
      refreshSendButton();
    },
    async () => {
      try {
        // 「残したい人」「ぼかしてほしい人」の指定(任意)があれば、参照用の切り出し画像を先にアップロードする。
        // ここが失敗しても、動画本体の投稿自体は必ず完了させる(1件ずつtry/catchする)。
        const uploadMarks = async (marks, tag) => {
          if (marks.length === 0) return { list: [], errorDetail: "" };
          const results = await Promise.allSettled(marks.map(async (m, i) => {
            const blob = await cropMarkToBlob(m);
            if (!blob) throw new Error("crop-blob-null");
            const refPath = `events/${EV}/uploads/${uid}/${id}_${tag}_${i}.jpg`;
            await uploadBytesResumable(stRef(storage, refPath), blob, { contentType: "image/jpeg" });
            return { storagePath: refPath, xRatio: m.xRatio, yRatio: m.yRatio, sizeRatio: (m.rRatio || BLUR_MARK_RATIO) * 2 };
          }));
          const list = results.filter(r => r.status === "fulfilled").map(r => r.value);
          const failed = results.filter(r => r.status === "rejected");
          let errorDetail = "";
          if (failed.length > 0){
            console.error(`[event-digest] ${tag} upload failed:`, failed.map(r => r.reason));
            const first = failed[0].reason;
            errorDetail = (first && (first.code || first.message)) ? String(first.code || first.message) : String(first);
          }
          return { list, errorDetail };
        };

        const keepMarks = blurMarks.filter((m) => m.mode !== "blur");
        const forceMarks = blurMarks.filter((m) => m.mode === "blur");
        const [keepResult, forceResult] = await Promise.all([
          uploadMarks(keepMarks, "keep"),
          uploadMarks(forceMarks, "forceblur"),
        ]);
        const keepFaces = keepResult.list;
        const forceBlurFaces = forceResult.list;
        const uploadErrorDetail = keepResult.errorDetail || forceResult.errorDetail;
        const anyMarkFailed = (keepMarks.length > 0 && keepFaces.length === 0) ||
                               (forceMarks.length > 0 && forceBlurFaces.length === 0);

        const rec = {
          nickname, uid,
          fileName: f.name,
          storagePath,
          bytes: f.size,
          uploadedAt: serverTimestamp(),
          status: "uploaded"
        };
        if (keepFaces.length > 0) rec.keepFaces = keepFaces;
        if (forceBlurFaces.length > 0) rec.forceBlurFaces = forceBlurFaces;
        await set(dbRef(db, `events/${EV}/uploads/${id}`), rec);
        await set(dbRef(db, `events/${EV}/myUploads/${uid}/${id}`), {
          fileName: f.name, storagePath, bytes: f.size, at: serverTimestamp()
        });
        mine[id] = { fileName: f.name, storagePath, bytes: f.size };
        faceDone();
        if (anyMarkFailed){
          showMsg(`投稿は受け付けましたが、顔の指定は反映できませんでした。ご了承ください。（詳細: ${uploadErrorDetail}）`, "warn");
        } else {
          showMsg("投稿を受け付けました。ありがとうございます。", "ok");
        }
        picked = null;
        currentInput().value = "";
        resetBlurUI();
        renderList();
        setTimeout(() => { if (!uploading) faceIdle(); }, 2600);
      } catch (e){
        console.error("[event-digest] 受付処理エラー:", e);
        const detail = (e && (e.code || e.message)) ? `（詳細: ${e.code || e.message}）` : "";
        showMsg(`受付処理に失敗しました。もう一度お試しください。${detail}`, "err");
      } finally {
        window.onbeforeunload = null;
        uploading = false;
        el.dial.classList.remove("is-busy");
        refreshSendButton();
      }
    }
  );
});

// ---- 締切の監視 ----
function watchDeadline(){
  onValue(dbRef(db, `events/${EV}/config`), (snap) => {
    const c = snap.val() || {};
    const over = (c.closed === true) ||
                 (typeof c.deadline === "number" && Date.now() > c.deadline);
    isClosed = over;
    if (over && !uploading){
      el.app.classList.add("hidden");
      el.closed.classList.add("show");
    } else {
      el.closed.classList.remove("show");
      el.app.classList.remove("hidden");
    }
    refreshSendButton();
  }, () => { /* config 未設定でも動作します */ });
}

// ---- 起動 ----
(async function start(){
  try {
    const app = initializeApp(APP_CONFIG.firebase);
    const auth = getAuth(app);
    db = getDatabase(app);
    storage = getStorage(app);

    await signInAnonymously(auth);
    await new Promise((res) => onAuthStateChanged(auth, (u) => { if (u){ uid = u.uid; res(); } }));

    // 投稿先の決め方
    //   1) 受信中のイベント（Firebase の activeEvent）を最優先する
    //   2) 取れなければ QR の ?e= を使う
    //   3) それも無ければ APP_CONFIG.eventId
    // 古いポスターが会場に残っていても、常に受付中のイベントに入るようにするため。
    let active = null;
    try {
      const act = await get(dbRef(db, "activeEvent"));
      if (act.exists() && act.val() && act.val().eventId) active = act.val();
    } catch (e) { /* 読めない場合は下で控えを使う */ }

    if (active) {
      EV = String(active.eventId);
      if (active.eventName) el.eventName.textContent = active.eventName;
      if (QR_EVENT && QR_EVENT !== EV) {
        // 別のイベント用のポスターが混ざっている可能性を知らせる
        showMsg("このQRコードは別のイベントのものですが、" +
                "本日受付中の「" + (active.eventName || EV) + "」に投稿します。", "warn");
      }
    } else {
      if (QR_EVENT) EV = QR_EVENT;
      el.eventName.textContent = T.eventName + "（受付先: " + EV + "）";
    }

    // 操作パネルで入力された見出し・リード文・注意書きがあれば、それに差し替える。
    // 無ければ APP_CONFIG.texts の既定文言のまま。
    try {
      const posterSnap = await get(dbRef(db, `events/${EV}/config/poster`));
      if (posterSnap.exists()) {
        const p = posterSnap.val() || {};
        if (p.head) el.heading.textContent = p.head;
        if (p.lead) el.lead.textContent = p.lead;
        if (p.note) {
          const extra = document.createElement("p");
          extra.className = "lead";
          extra.style.cssText = "margin-top:10px;color:var(--amber-soft)";
          extra.textContent = p.note;
          el.lead.insertAdjacentElement("afterend", extra);
        }
      }
    } catch (e) { /* 読めなければ既定文言のまま表示する */ }

    // 操作パネルで投稿本数の上限が設定されていれば、それに従う。
    // 無ければ APP_CONFIG.maxFiles（既定値）のまま。
    try {
      const limitSnap = await get(dbRef(db, `events/${EV}/config/uploadLimit`));
      if (limitSnap.exists()) {
        const v = Number(limitSnap.val());
        if (v > 0) MAX_FILES = v;
      }
    } catch (e) { /* 読めなければ既定の本数のまま */ }

    const snap = await get(dbRef(db, `events/${EV}/myUploads/${uid}`));
    mine = snap.val() || {};

    el.nick.value = localStorage.getItem("evdigest_nick") || "";

    el.loading.classList.add("hidden");
    el.app.classList.remove("hidden");
    faceIdle();
    renderList();
    watchDeadline();
  } catch (e){
    el.loading.textContent = "接続できませんでした。電波の良い場所で、ページを再読み込みしてください。";
  }
})();
</script>
